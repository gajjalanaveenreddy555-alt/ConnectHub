{% extends "base.html" %}

{% block title %}
Login | ConnectHub
{% endblock %}


{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <div class="auth-logo">
            Connect<span>Hub</span>
        </div>

        <h1>Welcome Back 👋</h1>

        <p class="auth-subtitle">
            Login to continue to ConnectHub
        </p>

        {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
        {% endif %}


        <form method="POST">

            <label>Username</label>

            <input
                type="text"
                name="username"
                placeholder="Enter your username"
                required
            >


            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >


            <button
                type="submit"
                class="primary-button"
            >
                Login
            </button>

        </form>


        <p class="auth-footer">

            Don't have an account?

            <a href="/register">
                Create Account
            </a>

        </p>

    </div>

</div>

{% endblock %}
