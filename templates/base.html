<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}ConnectHub{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<!-- ================= NAVBAR ================= -->

<header class="top-navbar">

    <div class="navbar-inner">

        <a href="/" class="brand">
            Connect<span>Hub</span>
        </a>

       <form action="{{ url_for('search') }}" method="GET" class="top-search">

    <span>🔍</span>

    <input
        type="search"
        id="searchInput"
        name="q"
        placeholder="Search users or posts..."
        value="{{ request.args.get('q', '') if request.endpoint == 'search' else '' }}"
    >

    <button type="submit" class="search-submit">
        Search
    </button>

</form>

    <div class="nav-icons">

    <a href="/" title="Home">🏠</a>

    <a href="/users" title="Users">👥</a>

    <a href="/create-post" title="Create Post">➕</a>

    <a href="/notifications" class="notification-link" title="Notifications">
        🔔

        {% if unread_notifications and unread_notifications > 0 %}
            <b class="notification-count">
                {{ unread_notifications }}
            </b>
        {% endif %}
    </a>

    <a href="/profile" class="nav-profile" title="Profile">
        👤
    </a>

</div>

    </div>

</header>


<!-- ================= MAIN ================= -->

<main>

    {% block content %}
    {% endblock %}

</main>


<!-- ================= FOOTER ================= -->

<footer class="site-footer">

    <p>© 2026 ConnectHub · Connect. Share. Discover.</p>

</footer>


<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
