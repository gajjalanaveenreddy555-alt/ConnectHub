{% extends "base.html" %}

{% block title %}
Register | ConnectHub
{% endblock %}


{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <div class="auth-logo">
            Connect<span>Hub</span>
        </div>

        <h1>Create Account</h1>

        <p class="auth-subtitle">
            Join the ConnectHub community
        </p>
            {% if error %}
            <div class="error-message">
            {{ error }}
        </div>
            {% endif %}


        <form method="POST">

            <label>Full Name</label>

            <input
                type="text"
                name="name"
                placeholder="Enter your name"
                required
            >


            <label>Username</label>

            <input
                type="text"
                name="username"
                placeholder="Choose a username"
                required
            >


            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Create a password"
                required
            >


            <button type="submit" class="primary-button">
                Create Account
            </button>

        </form>


        <p class="auth-footer">
            Already have an account?
            <a href="/login">Login</a>
        </p>

    </div>

</div>

{% endblock %}
