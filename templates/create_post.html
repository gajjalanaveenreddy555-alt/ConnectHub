{% extends "base.html" %}

{% block title %}
Create Post | ConnectHub
{% endblock %}


{% block content %}

<div class="create-post-page">

    <div class="create-post-card">

        <!-- HEADER -->

        <div class="create-post-header">

            <div class="create-post-icon">
                ✨
            </div>

            <div>
                <h1>Create a Post</h1>

                <p>
                    Share what's on your mind with your friends.
                </p>
            </div>

        </div>


        <!-- FORM -->

        <form
            method="POST"
            enctype="multipart/form-data"
            class="create-post-form"
        >

            <!-- TEXT AREA -->

            <label for="content">
                What's on your mind?
            </label>

            <textarea
                id="content"
                name="content"
                placeholder="Share your thoughts, ideas, achievements..."
                required
            ></textarea>


            <!-- IMAGE UPLOAD -->

            <div class="image-upload-section">

                <label>
                    📷 Add Image
                </label>

                <div class="file-input-wrapper">

                    <input
                        type="file"
                        name="image"
                        id="image"
                        accept="image/*"
                    >

                </div>

                <p class="upload-hint">
                    JPG, PNG or JPEG images are supported.
                </p>

            </div>


            <!-- BUTTONS -->

            <div class="create-post-actions">

                <a
                    href="/"
                    class="cancel-post-button"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="publish-post-button"
                >
                    🚀 Publish Post
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
